name: ✦ Shiny Refresh

on:
  schedule:
    - cron: "0 16 * * *"   # 每天北京时间 00:00
  workflow_dispatch:
    inputs:
      character:
        description: "选择人物并保存到配置；from-config 保留当前设置"
        required: false
        default: from-config
        type: choice
        options:
          - from-config
          - random
          - 櫻木真乃
          - 風野灯織
          - 八宮めぐる
          - 月岡恋鐘
          - 幽谷霧子
          - 三峰結華
          - 田中摩美々
          - 白瀬咲耶
          - 小宮果穂
          - 園田智代子
          - 西城樹里
          - 杜野凛世
          - 有栖川夏葉
          - 桑山千雪
          - 大崎甘奈
          - 大崎甜花
          - 芹沢あさひ
          - 黛冬優子
          - 和泉愛依
          - 浅倉透
          - 樋口円香
          - 福丸小糸
          - 市川雛菜
          - 七草にちか
          - 緋田美琴
          - 斑鳩ルカ
          - 鈴木羽那
          - 鈴木羽那（旧版）
          - 郁田はるき
  push:
    branches: [main]
    paths: [config.json, projects.json, build.py, requirements.txt, 'assets/game/**', 'assets/fonts/**', 'assets/illustrations/**', data/icons.json, data/characters.json, 'tests/**', .github/workflows/shiny-refresh.yml]

permissions:
  contents: write

concurrency:
  group: shiny-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save selected character
        if: github.event_name == 'workflow_dispatch' && inputs.character != '' && inputs.character != 'from-config'
        env:
          CHARACTER_CHOICE: ${{ inputs.character }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import build
          path = Path("config.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          cfg = build.config_with_character(cfg, os.environ["CHARACTER_CHOICE"])
          build.write_atomic(path, json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          print("Selected character:", cfg["character"])
          PY
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -v
          python build.py --strict-refresh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md data config.json
          git diff --staged --quiet || git commit -m "✦ daily shiny refresh"
          git push
